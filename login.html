<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#991B1B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KCC POS">
    <title>Admin Login | Karthik Chicken Centre</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./app-icon.svg">
    <style>
        :root {
            color-scheme: light;
            font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
            color: #172b4d;
            background: #f5f7fa;
        }
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background:
                linear-gradient(135deg, rgba(248, 241, 229, .9), rgba(235, 222, 200, .88)),
                repeating-linear-gradient(90deg, #e6d5bd 0, #e6d5bd 2px, #ecdcc6 3px, #ecdcc6 110px);
        }
        .login-card {
            width: min(100%, 430px);
            overflow: hidden;
            border: 1px solid rgba(15, 41, 82, .12);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(39, 31, 20, .2);
        }
        .login-heading {
            padding: 25px 24px 23px;
            background: #991b1b;
            color: #fff;
            text-align: center;
        }
        .rooster {
            display: grid;
            width: 54px;
            height: 54px;
            margin: 0 auto 10px;
            place-items: center;
            border-radius: 16px;
            background: rgba(255, 255, 255, .16);
            font-size: 31px;
        }
        h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(21px, 5vw, 26px); }
        .subtitle { margin: 7px 0 0; color: #fde047; font-size: 13px; font-weight: 800; }
        form { display: grid; gap: 16px; padding: 25px 24px 24px; }
        label { display: block; margin-bottom: 7px; color: #334155; font-size: 13px; font-weight: 800; }
        input {
            width: 100%;
            min-height: 48px;
            padding: 11px 13px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #fff;
            color: #172b4d;
            font: inherit;
            font-size: 16px;
        }
        input:focus { border-color: #14532d; outline: 3px solid rgba(20, 83, 45, .12); }
        .password-wrap { display: flex; gap: 7px; }
        .password-wrap input { min-width: 0; }
        .show-password {
            min-width: 52px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #f8fafc;
            color: #334155;
            font-size: 19px;
            cursor: pointer;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: -3px;
            color: #475569;
            font-size: 13px;
        }
        .remember input { width: 18px; min-height: 18px; margin: 0; accent-color: #14532d; }
        .login-button {
            min-height: 49px;
            border: 0;
            border-radius: 9px;
            background: #14532d;
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        .login-button:hover { background: #166534; }
        .login-button:disabled { cursor: wait; opacity: .7; }
        .error {
            display: none;
            margin: 0;
            padding: 10px 12px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            font-weight: 700;
        }
        .error.visible { display: block; }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-heading { padding: 22px 18px; }
            form { padding: 21px 18px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="login-heading">
            <span class="rooster" aria-hidden="true">🐓</span>
            <h1>Karthik Chicken Centre</h1>
            <p class="subtitle">Admin Login Only</p>
        </header>
        <form id="loginForm">
            <div>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div>
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="show-password" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">◉</button>
                </div>
            </div>
            <label class="remember">
                <input id="remember" name="remember" type="checkbox">
                <span>Keep me logged in on this device</span>
            </label>
            <p class="error" id="loginError" role="alert"></p>
            <button class="login-button" id="loginButton" type="submit">Login to POS</button>
        </form>
    </main>
    <script>
        const form = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginButton = document.getElementById("loginButton");
        const loginError = document.getElementById("loginError");

        togglePassword.addEventListener("click", () => {
            const reveal = passwordInput.type === "password";
            passwordInput.type = reveal ? "text" : "password";
            togglePassword.setAttribute("aria-pressed", String(reveal));
            togglePassword.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();
            loginError.classList.remove("visible");
            loginButton.disabled = true;
            loginButton.textContent = "Signing in…";

            try {
                const response = await fetch("./api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: passwordInput.value,
                        remember: document.getElementById("remember").checked
                    })
                });
                const result = await response.json();
                if (!response.ok) {
                    loginError.textContent = result.error || "Unable to sign in. Please try again.";
                    loginError.classList.add("visible");
                    return;
                }
                window.location.replace("./");
            } catch (error) {
                console.error("Admin sign-in request failed.", error);
                loginError.textContent = "Unable to reach the login service. Please try again.";
                loginError.classList.add("visible");
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login to POS";
            }
        });

        if (new URLSearchParams(window.location.search).has("expired")) {
            loginError.textContent = "Your admin session has expired. Please sign in again.";
            loginError.classList.add("visible");
        }
    </script>
</body>
</html>
